[project]
name = "agentdash"
version = "0.1.0"
description = "Fleet dashboard for coding agents across harnesses and machines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Robert Hoehndorf" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "aiosqlite>=0.20",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "httpx>=0.27",
  "watchfiles>=0.24",
  "pywebpush>=2.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
agentdash = "agentdash.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdash"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
